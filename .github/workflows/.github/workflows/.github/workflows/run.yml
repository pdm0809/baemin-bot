name: Baemin Collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 도구 설치
        run: pip install requests

      - name: 배민 데이터 가져오기
        run: python check_baemin.py
