<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>초곡 기지국 - 배민커넥트비즈</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%EC%B0%88%EA%B3%A1%20%EA%B8%B0%EC%A7%80%EA%B5%AD%22%2C%22short_name%22%3A%22%EC%B0%88%EA%B3%A1%EA%B8%B0%EC%A7%80%EA%B5%AD%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">

  <style>
    *{box-sizing:border-box;margin:0;padding:0; -webkit-tap-highlight-color:transparent;}
    body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior-y:none; user-select: none;}
    .header{background:#1c1c1e;padding:3vw 4vw;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;border-bottom:1px solid #333;}
    .btn{border:none;padding:2.5vw 4vw;border-radius:10px;font-weight:900;font-size:4vw;cursor:pointer;white-space:nowrap;}
    .copy-btn{background:#34C759;color:#000;border:none;padding:1.5vw 3vw;border-radius:6px;font-weight:900;cursor:pointer;font-size:3.5vw;margin-top:2vw;box-shadow:0 2px 5px rgba(0,0,0,0.3);transition:transform 0.1s;}
    .copy-btn:active{transform:scale(0.95);}
    .card-container{flex:1;display:flex;flex-direction:column;gap:2px;padding:2px;overflow:hidden;}
    .card{flex:1;display:flex;flex-direction:column;justify-content:center;background:#111;padding:3vw 5vw;border-radius:6px;border:1px solid #222; position:relative;}
    .card.active{border:2.5px solid #fff;background:#1a1a1a;}
    .total-section{background:#000;padding:4vw 5vw;border-top:1px solid #333;flex-shrink:0;}
    .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;overflow-y:auto;}
    .modal-box{background:#1c1c1e;margin:4vw;border-radius:16px;padding:5vw;}
    .sec-title{font-size:4.5vw;font-weight:700;color:#FF9500;margin:4vw 0 2vw;}
    .irow{display:flex;justify-content:space-between;align-items:center;margin-bottom:3vw;}
    .ilabel{font-size:4vw;color:#ccc;}
    .ifield{background:#2c2c2e;color:#fff;border:1px solid #444;border-radius:8px;padding:2vw 3vw;font-size:4.5vw;font-weight:700;width:28vw;text-align:center;}

    .rider-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;color:#fff;z-index:1000;flex-direction:column;}
    .rider-header{background:#1c1c1e;color:#fff;padding:3vw 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;flex-shrink:0;}
    .table-wrapper{flex:1; overflow:auto; -webkit-overflow-scrolling:touch; background:#000;}
    .rider-table{width:max-content; border-collapse:collapse; font-size:3.2vw; color:#ddd; border-spacing:0;}
    .rider-table th{background:#1c1c1e; color:#bbb; font-weight:700; text-align:center; border:1px solid #333; padding:2vw 2.5vw; vertical-align:middle; white-space:nowrap; cursor:pointer;}
    .rider-table th:active{background:#333;}
    .rider-table td{padding:2vw 2.5vw; text-align:center; border:1px solid #222; white-space:nowrap; background:#111; color:#eee;}
    
    .sticky-name{position:sticky; left:0; z-index:5; background:#1c1c1e !important; border-right:2px solid #444 !important; font-weight:bold; color:#fff !important;}
    td.sticky-name{background:#161616 !important; color:#fff !important;}
    
    .sum-row td{background:#222 !important; font-weight:900; color:#34C759; position:sticky; top:0; z-index:4;}
    .sum-row td.sticky-name{z-index:6; background:#222 !important; color:#34C759 !important;}
    
    .status-badge{padding:0.6vw 2vw; border-radius:12px; font-size:2.8vw; font-weight:700; display:inline-block;}
    .status-delivering{background:#0a3a1a; color:#34C759;}
    .status-ready{background:#222; color:#888;}
    
    #toast{visibility:hidden;min-width:250px;margin-left:-125px;background-color:#333;color:#fff;text-align:center;border-radius:8px;padding:4vw;position:fixed;z-index:3000;left:50%;bottom:10vw;font-size:4vw;font-weight:bold;opacity:0;transition:opacity 0.3s, bottom 0.3s;box-shadow:0 4px 6px rgba(0,0,0,0.5);}
    #toast.show{visibility:visible;opacity:1;bottom:15vw;}
  </style>
</head>
<body oncontextmenu='return false;'>

  <div id='security-login-screen' style='position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center;'>
    <div style='background: #1c1c1e; padding: 8vw 6vw; border-radius: 16px; border: 1px solid #333; text-align: center; width: 80%; max-width: 350px;'>
      <div style='font-size: 6vw; font-weight: 900; color: #34C759; margin-bottom: 2vw;'>🛡️ 기지국 접속</div>
      <div style='color: #888; font-size: 3.5vw; margin-bottom: 6vw;'>관리자 비밀번호를 입력하세요.</div>
      <input type='password' id='chogok-pwd' placeholder='비밀번호' style='width: 100%; padding: 4vw; margin-bottom: 5vw; background: #000; color: #fff; border: 1px solid #444; border-radius: 8px; font-size: 5vw; text-align: center; outline: none;' onkeypress='if(event.keyCode===13) unlockDashboard()'>
      <button onclick='unlockDashboard()' style='width: 100%; padding: 4vw; background-color: #34C759; color: #000; border: none; border-radius: 8px; font-size: 4.5vw; font-weight: bold; cursor: pointer;'>대시보드 열기</button>
    </div>
  </div>

  <div id='toast'></div>

  <div class='header'>
    <div style='display:flex;align-items:center;gap:1.5vw;'>
      <div id='dayName' style='font-size:7.5vw;font-weight:900;color:#fff;white-space:nowrap;'></div>
      <div id='ridingCount' onclick='openRiders()' style='background:#2c2c2e;color:#34C759;font-size:3.8vw;font-weight:900;padding:1.5vw 2.5vw;border-radius:8px;cursor:pointer;white-space:nowrap;'>🛵 -명</div>
    </div>
    <div style='display:flex;gap:1.5vw;'>
      <button class='btn' style='background:#2c2c2e;color:#FF9500;padding:2vw 3vw;' onclick='openSettings()'>⚙️</button>
      <button id='refreshBtn' class='btn' style='background:#3a3a3c;color:#fff;padding:2vw 3vw;' onclick='loadData()'>🔄 갱신</button>
    </div>
  </div>

  <div id='cards' class='card-container'></div>

  <div class='total-section' style='display:flex;justify-content:space-between;align-items:flex-end;'>
    <div></div>
    <div style='text-align:right;'>
      <div style='color:#666;font-size:3.5vw;font-weight:bold;margin-bottom:2px;'>오늘 합계 (SLA 09~24시)</div>
      <div id='totalDone' style='font-size:16vw;font-weight:900;color:#fff;line-height:1;'>-</div>
      <div id='updatedAt' style='color:#444;font-size:3vw;margin-top:6px;'></div>
    </div>
  </div>

  <div id='modal' class='modal'>
    <div class='modal-box'>
      <div style='font-size:6vw;font-weight:900;margin-bottom:4vw;'>⚙️ 수동 설정</div>
      <div class='sec-title' style='display:flex;justify-content:space-between;align-items:center;margin-bottom:3vw;'>
        <span style='font-size:4.5vw;font-weight:700;color:#FF9500;'>📦 목표세트</span>
        <div style='display:flex;align-items:center;background:#2c2c2e;border-radius:8px;padding:1vw;'>
          <div onclick='changeSetCount(-1)' style='color:#FF9500;font-size:4.5vw;font-weight:900;padding:1vw 3vw;cursor:pointer;'>➖</div>
          <div id='setNumberDisplay' style='color:#fff;font-size:4.5vw;font-weight:900;width:5vw;text-align:center;'>6</div>
          <div onclick='changeSetCount(1)' style='color:#FF9500;font-size:4.5vw;font-weight:900;padding:1vw 3vw;cursor:pointer;'>➕</div>
        </div>
      </div>
      <div class='irow'><span class='ilabel'>🌅 아침/점심피크</span><input class='ifield' id='t_morning' type='number'></div>
      <div class='irow'><span class='ilabel'>☀️ 오후논피크</span><input class='ifield' id='t_afternoon' type='number'></div>
      <div class='irow'><span class='ilabel'>🌆 저녁피크</span><input class='ifield' id='t_evening' type='number'></div>
      <div class='irow'><span class='ilabel'>🌙 심야</span><input class='ifield' id='t_night' type='number'></div>
      <button class='btn' style='width:100%;background:#FF9500;color:#fff;padding:4vw;font-size:4.5vw;margin-top:4vw;' onclick='closeSettings()'>닫기</button>
    </div>
  </div>

  <div id='riderModal' class='rider-modal'>
    <div style='height:100vh; display:flex; flex-direction:column;'>
      <div class='rider-header'>
        <div style='font-size:4.2vw;font-weight:900;color:#34C759;'>🛵 기사 상세 현황</div>
        <div style='display:flex;'>
          <button id='riderRefreshBtn' class='btn' style='background:#3a3a3c;color:#fff;margin-right:2vw;padding:1.5vw 2.5vw;font-size:3.5vw;' onclick='refreshRiderData()'>🔄 갱신</button>
          <button class='btn' style='background:#3a3a3c;color:#fff;padding:1.5vw 2.5vw;font-size:3.5vw;' onclick='closeRiders()'>✕ 닫기</button>
        </div>
      </div>
      
      <div style='padding:2vw 3vw; background:#1c1c1e; display:flex; gap:2vw; border-bottom:1px solid #333; flex-shrink:0;'>
        <input type='text' id='searchInput' placeholder='기사 이름 검색' style='flex:1; background:#000; color:#fff; border:1px solid #444; border-radius:6px; padding:2vw 3vw; font-size:3.8vw;' onkeypress='if(event.keyCode==13) updateRiderTableHTML()'>
        <button class='btn' style='background:#007AFF; color:#fff; padding:2vw 4vw; font-size:3.5vw;' onclick='updateRiderTableHTML()'>검색</button>
      </div>

      <div class='table-wrapper' id='riderScrollArea'>
        <table class='rider-table'>
          <thead id='riderTableHead'></thead>
          <tbody id='riderTableBody'></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbybEopFhrpBc1IfVtgoWatjNcjq-ucF_i3jnCRpNiUVQ-GNhVkEbt6SjAq9Bv0ipM5h/exec";

    var COLORS={morning:'#FF9500',afternoon:'#34C759',evening:'#FF3B30',night:'#AF52DE'};
    var NAMES={morning:'아침/점심피크',afternoon:'오후논피크',evening:'저녁피크',night:'심야'};
    var ORDER=['morning','afternoon','evening','night'];
    var KEYS={morning:'totalMorningCompleted',afternoon:'totalLunchCompleted',evening:'totalDinnerCompleted',night:'totalNightCompleted'};
    var currentData=null;
    var isRefreshing = false;

    var statusFilter = 'DELIVERING'; // 기본값: 운행중 (클릭 시 운행종료 전환)
    var sortCol = 'allDay';          
    var sortAsc = false;             

    function unlockDashboard() {
      var pwd = document.getElementById("chogok-pwd").value;
      if (pwd === "8289") {
        document.getElementById("security-login-screen").style.display = "none";
      } else {
        alert("❌ 비밀번호가 일치하지 않습니다.");
        document.getElementById("chogok-pwd").value = "";
      }
    }

    function showToast(msg){
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'show';
      setTimeout(function(){ t.className = t.className.replace('show',''); }, 2500);
    }

    function render(d){
      currentData=d;
      document.getElementById('dayName').textContent=d.dayName+'요일';
      document.getElementById('updatedAt').textContent='신호: '+d.updatedAt;
      
      var activeRiders = d.riderList ? d.riderList.filter(function(r){ var st = r.status ? (r.status.code || r.status) : 'DELIVERING'; return st === 'DELIVERING'; }).length : 0;
      document.getElementById('ridingCount').textContent='🛵 '+activeRiders+'명';
      
      var total=d.total||{}; var html=''; var totalDone=0;
      ORDER.forEach(function(id){
        var color=COLORS[id];
        var target=typeof d.targets[id]==='object'?d.targets[id][d.dayIdx]:d.targets[id];
        var done=total[KEYS[id]]||0; totalDone+=done;
        var remain=Math.max(target-done,0); var isActive=id===d.activeSlot; var isDone=done>=target;
        
        html+='<div class="card '+(isActive?'active':'')+'">';
        html+='<div style="display:flex;justify-content:space-between;align-items:center;">';
        html+='<div style="flex:1;">';
        html+='<div style="font-size:6vw;font-weight:900;color:'+(isActive?color:'#555')+'">'+NAMES[id]+'</div>';
        html+='<div style="display:flex;gap:20px;margin-top:10px;">';
        html+='<div style="text-align:center;"><div style="color:#fff;font-size:1.8rem;font-weight:900;">'+target+'</div><div style="color:#bbb;font-size:0.8rem;font-weight:bold;">목표세트</div></div>';
        html+='<div style="text-align:center;"><div style="color:#fff;font-size:1.8rem;font-weight:900;">'+done+'</div><div style="color:#bbb;font-size:0.8rem;font-weight:bold;">달성물량</div></div>';
        html+='</div></div>';
        html+='<div style="text-align:right;">';
        html+='<div style="font-size:'+(isDone?'2rem':'4.5rem')+';font-weight:900;color:'+(isActive?'#fff':'#333')+'">'+(isDone?'달성완료':remain)+'</div>';
        html+=(isDone?'':'<div style="font-size:0.8rem;color:#555;font-weight:bold;text-align:right;">남은 물량</div>');
        if(isActive) {
          html+='<button class="copy-btn" onclick="copyText(\''+id+'\', '+target+', '+remain+');">📋 복사</button>';
        }
        html+='</div>';
        html+='</div></div>';
      });
      document.getElementById('cards').innerHTML=html;
      document.getElementById('totalDone').textContent=totalDone;
    }

    function toggleSort(col) {
      if (sortCol === col) {
        sortAsc = !sortAsc;
      } else {
        sortCol = col;
        sortAsc = false;
      }
      updateRiderTableHTML();
    }

    function toggleStatusFilter() {
      statusFilter = (statusFilter === 'DELIVERING') ? 'READY' : 'DELIVERING';
      updateRiderTableHTML();
    }

    function getSortIcon(col) {
      if (sortCol !== col) return '';
      return sortAsc ? ' ▲' : ' ▼';
    }

    function updateRiderTableHTML(){
      if(!currentData||!currentData.riderList){return;}
      var filterKeyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      
      var stLabel = statusFilter === 'DELIVERING' ? ' (운행중만)' : ' (운행종료만)';

      var theadHtml = '<tr>' +
        '<th rowspan="2" class="sticky-name" onclick="toggleSort(\'name\')">이름' + getSortIcon('name') + '</th>' +
        '<th rowspan="2" onclick="toggleStatusFilter()" style="color:#34C759;">운행상태' + stLabel + '</th>' +
        '<th rowspan="2" onclick="toggleSort(\'userId\')">아이디' + getSortIcon('userId') + '</th>' +
        '<th rowspan="2">휴대폰번호</th>' +
        '<th rowspan="2" onclick="toggleSort(\'allDay\')" style="background:#003366; color:#66b2ff; font-weight:900;">총 배달완료' + getSortIcon('allDay') + '</th>' +
        '<th colspan="4">SLA 배달완료</th>' +
        '<th colspan="4">SLA 거절</th>' +
        '<th colspan="4">SLA 배차취소</th>' +
        '<th colspan="4">SLA 배달취소 (라이더 귀책)</th>' +
        '<th colspan="5">SLA 슬롯별 배달완료</th>' +
        '<th rowspan="2" onclick="toggleSort(\'sOut\')">SLA 시간외 배달' + getSortIcon('sOut') + '</th>' +
        '<th colspan="24">시간대별 배달완료</th>' +
      '</tr><tr>' +
        '<th onclick="toggleSort(\'cFood\')">푸드</th><th onclick="toggleSort(\'cBmart\')">비마트</th><th onclick="toggleSort(\'cStore\')">배민스토어</th><th onclick="toggleSort(\'cTot\')">합계' + getSortIcon('cTot') + '</th>' +
        '<th onclick="toggleSort(\'rTot\')">합계' + getSortIcon('rTot') + '</th><th onclick="toggleSort(\'rFood\')">푸드</th><th onclick="toggleSort(\'rBmart\')">비마트</th><th onclick="toggleSort(\'rStore\')">배민스토어</th>' +
        '<th onclick="toggleSort(\'canTot\')">합계</th><th>푸드</th><th>비마트</th><th>배민스토어</th>' +
        '<th onclick="toggleSort(\'fTot\')">합계</th><th>푸드</th><th>비마트</th><th>배민스토어</th>' +
        '<th onclick="toggleSort(\'pM\')">아침점심피크</th><th onclick="toggleSort(\'pA\')">오후논피크</th><th onclick="toggleSort(\'pE\')">저녁피크</th><th onclick="toggleSort(\'pN\')">심야논피크</th><th onclick="toggleSort(\'pTot\')">합계</th>' +
        '<th>6시</th><th>7시</th><th>8시</th><th>9시</th><th>10시</th><th>11시</th>' +
        '<th>12시</th><th>13시</th><th>14시</th><th>15시</th><th>16시</th><th>17시</th>' +
        '<th>18시</th><th>19시</th><th>20시</th><th>21시</th><th>22시</th><th>23시</th>' +
        '<th>0시</th><th>1시</th><th>2시</th><th>3시</th><th>4시</th><th>5시</th>' +
      '</tr>';

      var list = currentData.riderList.filter(function(r){
        var st = r.status ? (r.status.code || r.status) : 'READY';
        if (statusFilter === 'DELIVERING' && st !== 'DELIVERING') return false;
        if (statusFilter === 'READY' && st === 'DELIVERING') return false;
        if (!filterKeyword) return true;
        return (r.name || '').toLowerCase().indexOf(filterKeyword) !== -1;
      });

      list.sort(function(a, b) {
        var accA = a.acceptance || a.deliveryAcceptanceCount || {}, ptA = a.peakTime || a.deliveryPeakTimeCount || {};
        var accB = b.acceptance || b.deliveryAcceptanceCount || {}, ptB = b.peakTime || b.deliveryPeakTimeCount || {};
        
        var valA = 0, valB = 0;
        if (sortCol === 'name') { valA = a.name || ''; valB = b.name || ''; }
        else if (sortCol === 'userId') { valA = a.userId || ''; valB = b.userId || ''; }
        else if (sortCol === 'allDay') { valA = accA.allDayComplete !== undefined ? accA.allDayComplete : (accA.totalComplete || 0); valB = accB.allDayComplete !== undefined ? accB.allDayComplete : (accB.totalComplete || 0); }
        else if (sortCol === 'cTot') { valA = accA.totalComplete || 0; valB = accB.totalComplete || 0; }
        else if (sortCol === 'rTot') { valA = accA.totalReject || 0; valB = accB.totalReject || 0; }
        else if (sortCol === 'cFood') { valA = accA.foodComplete || 0; valB = accB.foodComplete || 0; }
        else if (sortCol === 'cBmart') { valA = accA.bmartComplete || 0; valB = accB.bmartComplete || 0; }
        else if (sortCol === 'cStore') { valA = accA.storeComplete || 0; valB = accB.storeComplete || 0; }
        else if (sortCol === 'pM') { valA = ptA.morning || 0; valB = ptB.morning || 0; }
        else if (sortCol === 'pA') { valA = ptA.afternoon || 0; valB = ptB.afternoon || 0; }
        else if (sortCol === 'pE') { valA = ptA.evening || 0; valB = ptB.evening || 0; }
        else if (sortCol === 'pN') { valA = ptA.midnight || 0; valB = ptB.midnight || 0; }

        if (typeof valA === 'string') {
          return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return sortAsc ? valA - valB : valB - valA;
      });

      var sumAllDay=0, sumCompFood=0, sumCompBmart=0, sumCompStore=0, sumCompTotal=0;
      var sumRejTotal=0, sumRejFood=0, sumRejBmart=0, sumRejStore=0;
      var sumCanTotal=0, sumCanFood=0, sumCanBmart=0, sumCanStore=0;
      var sumFaultTotal=0, sumFaultFood=0, sumFaultBmart=0, sumFaultStore=0;
      var sumPeakM=0, sumPeakA=0, sumPeakE=0, sumPeakN=0, sumPeakTot=0, sumSlaOut=0;
      var sumHourly = new Array(24).fill(0);

      var rowsHtml = '';
      list.forEach(function(r){
        var acc = r.acceptance || r.deliveryAcceptanceCount || {};
        var pt = r.peakTime || r.deliveryPeakTimeCount || {};
        var st = r.status ? (r.status.code || r.status) : 'READY';
        var stDesc = (r.status && r.status.desc) ? r.status.desc : (st === 'DELIVERING' ? '운행중' : '운행 종료');
        var badgeClass = st === 'DELIVERING' ? 'status-delivering' : 'status-ready';

        var allDay = acc.allDayComplete !== undefined ? acc.allDayComplete : (acc.totalComplete || 0);
        var cFood = acc.foodComplete || 0, cBmart = acc.bmartComplete || 0, cStore = acc.storeComplete || 0, cTot = acc.totalComplete || 0;
        var rTot = acc.totalReject || 0, rFood = acc.foodReject || 0, rBmart = acc.bmartReject || 0, rStore = acc.storeReject || 0;
        var canTot = acc.totalCancel || 0, canFood = acc.foodCancel || 0, canBmart = acc.bmartCancel || 0, canStore = acc.storeCancel || 0;
        var fTot = acc.totalRiderFault || 0, fFood = acc.foodRiderFault || 0, fBmart = acc.bmartRiderFault || 0, fStore = acc.storeRiderFault || 0;
        var pM = pt.morning || 0, pA = pt.afternoon || 0, pE = pt.evening || 0, pN = pt.midnight || 0, pTot = pM + pA + pE + pN;
        var sOut = acc.slaOutComplete || 0;

        sumAllDay += allDay; sumCompFood += cFood; sumCompBmart += cBmart; sumCompStore += cStore; sumCompTotal += cTot;
        sumRejTotal += rTot; sumRejFood += rFood; sumRejBmart += rBmart; sumRejStore += rStore;
        sumCanTotal += canTot; sumCanFood += canFood; sumCanBmart += canBmart; sumCanStore += canStore;
        sumFaultTotal += fTot; sumFaultFood += fFood; sumFaultBmart += fBmart; sumFaultStore += fStore;
        sumPeakM += pM; sumPeakA += pA; sumPeakE += pE; sumPeakN += pN; sumPeakTot += pTot; sumSlaOut += sOut;

        rowsHtml += '<tr>';
        rowsHtml += '<td class="sticky-name">' + r.name + '</td>';
        rowsHtml += '<td><span class="status-badge ' + badgeClass + '">' + stDesc + '</span></td>';
        rowsHtml += '<td>' + (r.userId || '-') + '</td>';
        rowsHtml += '<td>' + (r.phoneNumber || '-') + '</td>';
        rowsHtml += '<td style="font-weight:900; color:#66b2ff; background:#002244;">' + allDay + '</td>';
        
        rowsHtml += '<td>' + cFood + '</td><td>' + cBmart + '</td><td>' + cStore + '</td><td style="font-weight:bold;">' + cTot + '</td>';
        rowsHtml += '<td style="font-weight:bold; color:#FF3B30;">' + rTot + '</td><td>' + rFood + '</td><td>' + rBmart + '</td><td>' + rStore + '</td>';
        rowsHtml += '<td style="font-weight:bold;">' + canTot + '</td><td>' + canFood + '</td><td>' + canBmart + '</td><td>' + canStore + '</td>';
        rowsHtml += '<td style="font-weight:bold;">' + fTot + '</td><td>' + fFood + '</td><td>' + fBmart + '</td><td>' + fStore + '</td>';
        rowsHtml += '<td>' + pM + '</td><td>' + pA + '</td><td>' + pE + '</td><td>' + pN + '</td><td style="font-weight:bold;">' + pTot + '</td>';
        rowsHtml += '<td>' + sOut + '</td>';

        var hArr = r.hourlyCompleted || [];
        var hMap = {};
        hArr.forEach(function(item){ hMap[item.hour] = item.count; });
        
        for(var h = 6; h <= 29; h++) {
          var targetH = h >= 24 ? h - 24 : h;
          var val = hMap[targetH] !== undefined ? hMap[targetH] : (hMap[h] !== undefined ? hMap[h] : 0);
          var idx = h - 6;
          sumHourly[idx] += val;
          rowsHtml += '<td>' + (val > 0 ? val : 0) + '</td>';
        }
        rowsHtml += '</tr>';
      });

      var sumRowHtml = '<tr class="sum-row">' +
        '<td class="sticky-name">합계</td>' +
        '<td>-</td><td>-</td><td>-</td>' +
        '<td style="font-size:3.5vw; color:#66b2ff;">' + sumAllDay + '</td>' +
        '<td>' + sumCompFood + '</td><td>' + sumCompBmart + '</td><td>' + sumCompStore + '</td><td>' + sumCompTotal + '</td>' +
        '<td>' + sumRejTotal + '</td><td>' + sumRejFood + '</td><td>' + sumRejBmart + '</td><td>' + sumRejStore + '</td>' +
        '<td>' + sumCanTotal + '</td><td>' + sumCanFood + '</td><td>' + sumCanBmart + '</td><td>' + sumCanStore + '</td>' +
        '<td>' + sumFaultTotal + '</td><td>' + sumFaultFood + '</td><td>' + sumFaultBmart + '</td><td>' + sumFaultStore + '</td>' +
        '<td>' + sumPeakM + '</td><td>' + sumPeakA + '</td><td>' + sumPeakE + '</td><td>' + sumPeakN + '</td><td>' + sumPeakTot + '</td>' +
        '<td>' + sumSlaOut + '</td>';
      
      for(var i=0; i<24; i++){ sumRowHtml += '<td>' + sumHourly[i] + '</td>'; }
      sumRowHtml += '</tr>';

      document.getElementById('riderTableHead').innerHTML = theadHtml + sumRowHtml;
      document.getElementById('riderTableBody').innerHTML = rowsHtml || '<tr><td colspan="45" style="padding:10vw; text-align:center;">조건에 맞는 기사 데이터가 없습니다.</td></tr>';
    }

    function openRiders(){
      if(!currentData||!currentData.riderList||currentData.riderList.length===0){showToast('기사 데이터가 없어요');return;}
      document.getElementById('searchInput').value = '';
      updateRiderTableHTML();
      history.pushState({rider:true},'',location.href); document.getElementById('riderModal').style.display='flex';
    }
    function closeRiders(){document.getElementById('riderModal').style.display='none';}

    function loadData(){
      var btn=document.getElementById('refreshBtn'); btn.textContent='⏳...';
      fetch(GAS_URL + "?mode=json")
        .then(function(res){ return res.json(); })
        .then(function(d){
          render(d);
          btn.textContent='🔄 갱신';
          if(document.getElementById('riderModal').style.display==='flex'){ updateRiderTableHTML(); }
        })
        .catch(function(err){
          btn.textContent='🔄 갱신';
          showToast('데이터 조회 실패');
        });
    }

    function refreshRiderData(){
      if(isRefreshing) return; isRefreshing = true;
      var btn=document.getElementById('riderRefreshBtn'); btn.textContent='⏳...';
      fetch(GAS_URL + "?mode=json")
        .then(function(res){ return res.json(); })
        .then(function(d){
          render(d);
          if(document.getElementById('riderModal').style.display==='flex'){ updateRiderTableHTML(); }
          btn.textContent='🔄 갱신'; showToast('현황 갱신 완료!'); isRefreshing = false;
        })
        .catch(function(err){
          btn.textContent='🔄 갱신'; showToast('갱신 실패!'); isRefreshing = false;
        });
    }

    var scrollArea = document.getElementById('riderScrollArea');
    var startY = 0;
    scrollArea.addEventListener('touchstart', function(e){
      if(scrollArea.scrollTop <= 0) startY = e.touches[0].clientY;
    }, {passive: true});
    scrollArea.addEventListener('touchmove', function(e){
      if(scrollArea.scrollTop <= 0 && startY > 0) {
        var dy = e.touches[0].clientY - startY;
        if(dy > 80) {
          startY = 0;
          refreshRiderData();
        }
      }
    }, {passive: true});
    scrollArea.addEventListener('touchend', function(e){ startY = 0; });

    loadData(); setInterval(loadData,60000);
  </script>
</body>
</html>
